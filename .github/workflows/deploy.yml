name: deploy

on:
  push:
    branches: [master]

permissions:
  contents: write

# A newer push makes a run in flight stale: it would index an older commit and its push
# would be rejected. The newer run indexes everything, so cancel the older one.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  reapack-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # reapack-index reads package versions out of the git history, not the worktree.
          fetch-depth: 0

      # Installs the gems pinned in Gemfile.lock and caches them. Compiling rugged (libgit2)
      # takes over a minute, so only a cache miss pays for it; -j4 builds it on all cores.
      # bundler: default uses the Bundler that ships with Ruby (2.6.9, the version in the lock)
      # instead of running `gem install bundler` on every run.
      - uses: ruby/setup-ruby@v1
        env:
          MAKEFLAGS: -j4
        with:
          ruby-version: '3.4'
          bundler: default
          bundler-cache: true

      - name: Regenerate the index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bundle exec reapack-index --commit --name 'tRoshan Scripts'

      # Pushes made with GITHUB_TOKEN do not retrigger workflows, so this cannot loop.
      - name: Push the updated index
        run: git push

      # raw.githubusercontent.com caches index.xml for 5 minutes and ignores ReaPack's no-cache
      # request, so syncing right after a push can return the old index. Release downloads are
      # not cached that way: every upload gets a fresh download URL. This keeps a copy of the
      # committed index at https://github.com/thareeqroshan/ReaperStuff/releases/download/index/index.xml
      - name: Publish index.xml as a release download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view index >/dev/null 2>&1; then
            gh release upload index index.xml --clobber
          else
            gh release create index index.xml --prerelease --title 'index.xml' \
              --notes 'The latest index.xml, replaced on every push to master. ReaPack link: https://github.com/thareeqroshan/ReaperStuff/releases/download/index/index.xml'
          fi
