name: check

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  reapack-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # reapack-index reads package versions out of the git history, not the worktree.
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install reapack-index
        run: gem install reapack-index --pre

      - name: Validate every package
        run: reapack-index --check
