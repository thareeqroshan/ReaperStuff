name: check

on:
  pull_request:
  push:
    branches-ignore: [master]
  schedule:
    # GitHub evicts caches unused for 7 days. Running on master twice a week keeps the
    # gem cache that the deploy workflow restores warm.
    - cron: '23 4 * * 1,4'

jobs:
  reapack-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # reapack-index reads package versions out of the git history, not the worktree.
          fetch-depth: 0

      # Installs the gems pinned in Gemfile.lock and caches them. Compiling rugged (libgit2)
      # takes over a minute, so only a cache miss pays for it; -j4 builds it on all cores.
      # bundler: default uses the Bundler that ships with Ruby (2.6.9, the version in the lock)
      # instead of running `gem install bundler` on every run.
      - uses: ruby/setup-ruby@v1
        env:
          MAKEFLAGS: -j4
        with:
          ruby-version: '3.4'
          bundler: default
          bundler-cache: true

      # --check walks the whole worktree, including the gems that setup-ruby put in vendor/bundle.
      - name: Validate every package
        run: bundle exec reapack-index --check --ignore vendor/bundle
