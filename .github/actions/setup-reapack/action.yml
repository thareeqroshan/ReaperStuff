name: Set up reapack-index
description: Restore locked gems without rerunning Bundler installation on cache hits.
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler: default

    - name: Configure Bundler and cache identity
      id: bundle
      shell: bash
      run: |
        source /etc/os-release
        platform="$ID-$VERSION_ID-${RUNNER_ARCH,,}"
        ruby_version=$(ruby -e 'print RUBY_VERSION')
        lock_hash=$(sha256sum Gemfile.lock | cut -d ' ' -f 1)
        prefix="reapack-index-v1-$platform-ruby-$ruby_version-"
        echo "key=$prefix$lock_hash" >> "$GITHUB_OUTPUT"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        {
          echo "BUNDLE_PATH=$GITHUB_WORKSPACE/vendor/bundle"
          echo "BUNDLE_DEPLOYMENT=true"
        } >> "$GITHUB_ENV"

    - uses: actions/cache@v4
      id: cache
      with:
        path: vendor/bundle
        key: ${{ steps.bundle.outputs.key }}
        restore-keys: ${{ steps.bundle.outputs.prefix }}

    - name: Install missing gems
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        MAKEFLAGS: -j4
      run: |
        bundle check || bundle install --jobs 4
        bundle clean
